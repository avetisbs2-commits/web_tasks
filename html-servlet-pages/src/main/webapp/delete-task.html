<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Task</title>
</head>
<body>
<h1>Delete Task</h1>

<!-- TODO:
     HTML forms do not support DELETE directly.
     Use JavaScript fetch to call:
     DELETE /tasks?id=1
-->

<label for="taskId">Task ID</label>
<input id="taskId" type="number" value="1">
<button type="button" onclick="deleteTask()">Delete Task</button>

<p id="result"></p>

<script>
    function deleteTask() {
        const id = document.getElementById("taskId").value;

        fetch("tasks?id=" + id, {
            method: "DELETE"
        }).then(function (response) {
            document.getElementById("result").textContent = "Status: " + response.status;
        });
    }
</script>

<p><a href="tasks.html">Back to tasks</a></p>
</body>
</html>
